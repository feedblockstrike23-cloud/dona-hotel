<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dona Hotel — Concierge</title>
  <script src="https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/1.2.0-beta.10/libs/oversea/index.js"></script>
  <style>
    body { background: #1b263b; color: #fff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    
    /* Контейнер для чата по центру экрана */
    #coze-chat-container {
      width: 420px;
      height: 600px;
      background: #0d1b2a;
      border-radius: 20px;
      border: 1px solid #415a77;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Адаптив для телефонов */
    @media (max-width: 480px) {
      #coze-chat-container {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>
<body>

  <!-- Блок, куда Coze сам встроит полноценный чат -->
  <div id="coze-chat-container"></div>

  <script>
    window.onload = function() {
      const part1 = 'pat_6jUEKEcEr2bs7BySGzt19'; 
      const part2 = 'wXFJqJBipBq1uaAOm6SgaXnOEdhxKXWDNSzxz8p3Gsa';
      const realToken = part1 + part2;

      // Инициализируем чат во встроенном режиме (Embedded) внутри нашего контейнера
      new CozeWebSDK.WebChatClient({
        config: { 
          bot_id: '7695137104795795461' 
        },
        // Указываем элемент на странице, куда вставить чат
        el: document.getElementById('coze-chat-container'),
        componentProps: { 
          title: 'Dona Hotel Concierge',
          // Включаем полноразмерный режим для блока
          layout: 'pc'
        },
        auth: { 
          type: 'token', 
          token: realToken,
          onRefreshToken: function () { return realToken; }
        }
      });
    };
  </script>
</body>
</html>
